name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded push has nothing useful to say; cancel it rather than pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: test (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      # Both providers report. Stopping at the first failure would hide whether a break is
      # provider-specific, which is the single most useful thing this matrix can tell us.
      fail-fast: false
      matrix:
        provider: [Postgres, SqlServer]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Ironbell.slnx

      - name: Build
        run: dotnet build Ironbell.slnx --configuration Release --no-restore

      # ADR 0001's actual enforcement. Production is SQL Server; PostgreSQL is the provider the
      # layer must stay portable to. Running the same suite against both is what keeps that claim
      # honest rather than aspirational. Testcontainers supplies the databases.
      - name: Test
        env:
          IRONBELL_TEST_PROVIDER: ${{ matrix.provider }}
        run: dotnet test Ironbell.slnx --configuration Release --no-build

  bundle-budget:
    name: wasm bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The budget check runs inside publish and fails the build on its own, so there is nothing to
      # assert here. Kept as its own job so the payload size is visible without reading test logs.
      - name: Publish and check payload size
        run: dotnet publish src/Ironbell.Api/Ironbell.Api.csproj --configuration Release --output publish

  migration-bundle:
    name: migration bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build bundle
        shell: pwsh
        run: ./scripts/build-migration-bundle.ps1

      # Migrations are applied as a pipeline step and never on application startup, so the deploy
      # needs this artifact rather than the app doing it on boot.
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: migration-bundle
          path: artifacts/efbundle
          retention-days: 7
          if-no-files-found: error

  image:
    name: image
    runs-on: ubuntu-latest
    needs: [test, bundle-budget]
    # Only main publishes. A pull request proves the image builds; it does not get to push one.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # The sha tag is what deployments pin to; latest is a convenience only.
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [test, bundle-budget, migration-bundle, image]
    # Inert until DEPLOY_ENABLED is set to 'true' in repository variables, so this workflow can be
    # merged and exercised long before any Azure subscription exists. A missing secret would
    # otherwise fail every run on main for a reason unrelated to the change that triggered it.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v7

      # The migration bundle is framework-dependent, so the runtime has to be here. That is the
      # dependency accepted when the bundle stopped being self-contained.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: migration-bundle
          path: bundle

      - run: chmod +x bundle/efbundle

      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Container Apps has no stable outbound IP on consumption, so the server keeps only the
      # Azure-services rule. The runner needs its own, and only for as long as the migration takes.
      - name: Open the firewall for this runner
        id: firewall
        run: |
          ip=$(curl -fsS https://api.ipify.org)
          echo "rule=gh-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          az sql server firewall-rule create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server "${{ vars.AZURE_SQL_SERVER }}" \
            --name "gh-${{ github.run_id }}" \
            --start-ip-address "$ip" --end-ip-address "$ip" --output none

      # Applied here and never on application startup. A container that boots cannot alter the
      # schema, and replicas cannot race each other to migrate.
      - name: Apply migrations
        run: ./bundle/efbundle --connection "${{ secrets.SQL_CONNECTION_STRING }}"

      # always(), so a failed migration does not leave the runner's address authorised.
      - name: Close the firewall
        if: always() && steps.firewall.outcome == 'success'
        run: |
          az sql server firewall-rule delete \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server "${{ vars.AZURE_SQL_SERVER }}" \
            --name "${{ steps.firewall.outputs.rule }}" --output none

      # Migrations first, image second: the new schema is in place before any container serving the
      # new code exists. Pinned to the commit sha rather than latest, so a rollback is a redeploy of
      # a known tag rather than a race with whatever latest points at.
      - name: Deploy the image
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "ghcr.io/${{ github.repository }}:sha-${{ github.sha }}" \
            --output none

      - name: Report the deployed revision
        run: |
          az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "{url:properties.configuration.ingress.fqdn,image:properties.template.containers[0].image}" \
            --output table
