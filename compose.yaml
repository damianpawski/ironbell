# Local development databases only. Nothing here is deployed — production is Azure SQL
# (free offer) and there is no PostgreSQL in production at all.
#
# Both providers run locally for the same reason CI runs both: ADR 0001's portability claim is
# only real if something exercises it. SQL Server is what production runs; PostgreSQL is what the
# layer must stay portable to.
#
# Passwords below are local-only defaults. Override with IRONBELL_SQL_PASSWORD /
# IRONBELL_PG_PASSWORD if you would rather they were not on disk.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ironbell-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${IRONBELL_SQL_PASSWORD:-Ironbell_local_dev_1}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - ironbell-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    container_name: ironbell-postgres
    environment:
      POSTGRES_DB: ironbell
      POSTGRES_USER: ironbell
      POSTGRES_PASSWORD: "${IRONBELL_PG_PASSWORD:-ironbell_local_dev}"
    ports:
      - "5432:5432"
    volumes:
      - ironbell-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironbell -d ironbell"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ironbell-sqlserver-data:
  ironbell-postgres-data:
